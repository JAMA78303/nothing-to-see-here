<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #9fd3f5; }
  canvas { display: block; }
  #caption {
    position: absolute; left: 0; right: 0; top: 1260px; text-align: center;
    font: 900 110px/1 "Arial Black", Arial, sans-serif; color: #fff;
    -webkit-text-stroke: 14px #000; paint-order: stroke fill;
    text-shadow: 0 8px 0 rgba(0,0,0,.35);
    transform-origin: 50% 50%;
  }
</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<div id="caption"></div>
<script type="module">
import * as THREE from "three";

const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = skyTexture();
scene.fog = new THREE.Fog(0xcfe8f7, 60, 140);

const camera = new THREE.PerspectiveCamera(48, W / H, 0.1, 300);
camera.position.set(0, 6, 26);
camera.lookAt(0, -3.6, -8);

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0xdff1ff, 0x6b4a2b, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(-12, 25, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -25, right: 25, top: 25, bottom: -25, far: 80 });
scene.add(sun);

// ---------- textures ----------
function canvasTex(w, h, draw, repeatX = 1, repeatY = 1) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeatX, repeatY);
  return t;
}
function skyTexture() {
  return canvasTex(4, 256, (g, w, h) => {
    const grad = g.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, "#5aa9e6");
    grad.addColorStop(1, "#d6eefb");
    g.fillStyle = grad; g.fillRect(0, 0, w, h);
  });
}
function noisy(base, spots, n = 900, size = 6) {
  return (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    for (let i = 0; i < n; i++) {
      g.fillStyle = spots[i % spots.length];
      g.globalAlpha = 0.35 + Math.random() * 0.4;
      g.beginPath();
      g.ellipse(Math.random() * w, Math.random() * h, size * Math.random() + 1, size * Math.random() * 0.6 + 1, Math.random() * 3, 0, 7);
      g.fill();
    }
    g.globalAlpha = 1;
  };
}
const stripes = (g, w, h) => {
  for (let i = 0; i < 8; i++) {
    g.fillStyle = i % 2 ? "#5fae3a" : "#78c24a";
    g.fillRect((i * w) / 8, 0, w / 8, h);
  }
};

// One cloned texture per box so the pattern keeps real-world scale.
function mat(drawFn, scale, color) {
  return (sx, sy) => {
    const t = canvasTex(256, 256, drawFn, sx / scale, sy / scale);
    return new THREE.MeshLambertMaterial({ map: t, color: color ?? 0xffffff });
  };
}
const M = {
  grass: mat(stripes, 16),
  topsoil: mat(noisy("#8a5a33", ["#6e4524", "#a6703f", "#5a381c"]), 3),
  clay: mat(noisy("#a8643a", ["#8c4f2b", "#c27a48", "#7a4223"]), 3),
  deep: mat(noisy("#6b4426", ["#5a381c", "#7d5230", "#4a2e17"]), 3),
  concrete: mat(noisy("#d9d6cf", ["#c7c3ba", "#e8e6e1"], 500, 4), 4),
};

// ---------- ground block with a pool-shaped hole ----------
const GROUND_BOTTOM = -22;
const layers = [
  { top: 0, bottom: -0.25, mat: M.grass },
  { top: -0.25, bottom: -2.4, mat: M.topsoil },
  { top: -2.4, bottom: -4.2, mat: M.clay },
  { top: -4.2, bottom: GROUND_BOTTOM, mat: M.deep },
];
const ground = new THREE.Group();
scene.add(ground);

function box(x0, x1, y0, y1, z0, z1, matFn, parent = scene) {
  const sx = x1 - x0, sy = y1 - y0, sz = z1 - z0;
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), matFn(Math.max(sx, sz), sy));
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
// a ground region is cut into horizontal soil layers
function groundBox(x0, x1, y0, y1, z0, z1) {
  for (const L of layers) {
    const top = Math.min(y1, L.top), bot = Math.max(y0, L.bottom);
    if (top > bot) box(x0, x1, bot, top, z0, z1, L.mat, ground);
  }
}

// Pool footprint (outer, incl. shell): x -4.4..4.4, z -6.4..0 (cut open at the front face z=0)
const P = { x0: -4.4, x1: 4.4, zBack: -6.4, shallow: -1.6, deep: -2.9, t: 0.35 };
groundBox(-24, P.x0, GROUND_BOTTOM, 0, -40, 0);
groundBox(P.x1, 24, GROUND_BOTTOM, 0, -40, 0);
groundBox(P.x0, P.x1, GROUND_BOTTOM, 0, -40, P.zBack);
groundBox(P.x0, 0, GROUND_BOTTOM, P.shallow, P.zBack, 0);
groundBox(0, P.x1, GROUND_BOTTOM, P.deep, P.zBack, 0);

// ---------- pool shell (one group so it can lift out later) ----------
const pool = new THREE.Group();
scene.add(pool);
const t = P.t;
box(P.x0, 0, P.shallow, P.shallow + t, P.zBack, 0, M.concrete, pool);        // shallow floor
box(0, P.x1, P.deep, P.deep + t, P.zBack, 0, M.concrete, pool);              // deep floor
box(-t / 2, t / 2, P.deep, P.shallow + t, P.zBack, 0, M.concrete, pool);     // step between ends
box(P.x0, P.x0 + t, P.shallow, 0.12, P.zBack, 0, M.concrete, pool);          // left wall
box(P.x1 - t, P.x1, P.deep, 0.12, P.zBack, 0, M.concrete, pool);             // right wall
box(P.x0, P.x1, P.deep, 0.12, P.zBack, P.zBack + t, M.concrete, pool);       // back wall
// coping
box(P.x0 - 0.3, P.x1 + 0.3, 0.12, 0.22, P.zBack - 0.3, P.zBack + t, M.concrete, pool);
box(P.x0 - 0.3, P.x0 + t, 0.12, 0.22, P.zBack, 0, M.concrete, pool);
box(P.x1 - t, P.x1 + 0.3, 0.12, 0.22, P.zBack, 0, M.concrete, pool);

// pool water (two boxes to follow the step)
const waterMat = new THREE.MeshPhongMaterial({ color: 0x4fc3ec, transparent: true, opacity: 0.75, shininess: 80 });
const waterShallow = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), waterMat);
const waterDeep = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), waterMat);
pool.add(waterShallow, waterDeep);
function setPoolWater(level) { // 0 = empty, 1 = full
  const top = -0.05;
  const placeWater = (m, x0, x1, floor) => {
    const surface = floor + (top - floor) * level;
    const h = Math.max(0.001, surface - floor);
    m.visible = level > 0.01;
    m.scale.set(x1 - x0, h, -P.zBack - 2 * t);
    m.position.set((x0 + x1) / 2, floor + h / 2, P.zBack / 2 + t / 2);
  };
  placeWater(waterShallow, P.x0 + t, -t / 2, P.shallow + t);
  placeWater(waterDeep, t / 2, P.x1 - t, P.deep + t);
}

// ---------- house ----------
function house(cx, cz, w, scale = 1) {
  const g = new THREE.Group();
  const wall = (sx, sy) => new THREE.MeshLambertMaterial({ color: 0xfaf7f0, emissive: 0x2a2a2a });
  const h = 6.2, d = 6;
  box(-w / 2, w / 2, 0, h, -d / 2, d / 2, wall, g);
  // roof
  const roofShape = new THREE.Shape([new THREE.Vector2(-d / 2 - 0.6, 0), new THREE.Vector2(d / 2 + 0.6, 0), new THREE.Vector2(0, 2.8)]);
  const roof = new THREE.Mesh(
    new THREE.ExtrudeGeometry(roofShape, { depth: w + 1, bevelEnabled: false }),
    new THREE.MeshLambertMaterial({ map: canvasTex(64, 64, (c, cw, ch) => {
      c.fillStyle = "#d9612f"; c.fillRect(0, 0, cw, ch);
      c.fillStyle = "#b84c22"; for (let y = 0; y < ch; y += 8) c.fillRect(0, y, cw, 2);
    }, 4, 4) })
  );
  roof.rotation.y = Math.PI / 2;
  roof.position.set(-w / 2 - 0.5, h, 0);
  roof.castShadow = true;
  g.add(roof);
  box(w / 4, w / 4 + 0.9, h + 1, h + 3.2, -1, 0, () => new THREE.MeshLambertMaterial({ color: 0x9c5a3c }), g);
  // windows + shutters on the front face
  const glass = () => new THREE.MeshLambertMaterial({ color: 0x3b6fa8 });
  const frame = () => new THREE.MeshLambertMaterial({ color: 0xffffff });
  const shutter = () => new THREE.MeshLambertMaterial({ color: 0x1f4f9a });
  const cols = Math.round(w / 2.6);
  for (let row = 0; row < 2; row++) {
    for (let i = 0; i < cols; i++) {
      const x = -w / 2 + (i + 0.5) * (w / cols);
      const y = row ? 4.4 : 1.7;
      const isDoor = row === 0 && i === Math.floor(cols / 2);
      const ww = isDoor ? 1.8 : 1.1, wh = isDoor ? 2.4 : 1.4;
      const y0 = isDoor ? 0.05 : y - wh / 2;
      box(x - ww / 2 - 0.12, x + ww / 2 + 0.12, y0 - 0.12, y0 + wh + 0.12, d / 2, d / 2 + 0.05, frame, g);
      box(x - ww / 2, x + ww / 2, y0, y0 + wh, d / 2 + 0.05, d / 2 + 0.09, glass, g);
      if (!isDoor) {
        box(x - ww / 2 - 0.6, x - ww / 2 - 0.15, y0, y0 + wh, d / 2, d / 2 + 0.1, shutter, g);
        box(x + ww / 2 + 0.15, x + ww / 2 + 0.6, y0, y0 + wh, d / 2, d / 2 + 0.1, shutter, g);
      }
    }
  }
  g.position.set(cx, 0, cz);
  g.scale.setScalar(scale);
  scene.add(g);
  return g;
}
house(0, -22, 15);
house(19, -30, 9, 0.8);

// ---------- props ----------
function tree(x, z, s = 1) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.35, 3), new THREE.MeshLambertMaterial({ color: 0x6b4a2b }));
  trunk.position.y = 1.5;
  g.add(trunk);
  for (const [dx, dy, dz, r] of [[0, 3.6, 0, 1.8], [1, 3.1, 0.4, 1.3], [-1, 3.2, -0.3, 1.4], [0.2, 4.5, 0, 1.2]]) {
    const leaf = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), new THREE.MeshLambertMaterial({ color: 0x3f8a3a, flatShading: true }));
    leaf.position.set(dx, dy, dz);
    g.add(leaf);
  }
  g.traverse(o => (o.castShadow = true));
  g.position.set(x, 0, z);
  g.scale.setScalar(s);
  scene.add(g);
}
tree(-12, -15, 1.2);
tree(11, -14, 1);
tree(-20, -25, 1.4);

function cloud(x, y, z, s) {
  const g = new THREE.Group();
  const m = new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0xc8c8c8 });
  for (const [dx, dy, r] of [[0, 0, 2], [2, -0.3, 1.5], [-2, -0.4, 1.6], [0.8, 1, 1.4]]) {
    const p = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), m);
    p.position.set(dx, dy, 0);
    g.add(p);
  }
  g.position.set(x, y, z);
  g.scale.setScalar(s);
  scene.add(g);
}
cloud(-12, 20, -45, 2);
cloud(14, 24, -55, 2.4);

// ---------- groundwater (front-face overlay, clipped so it can rise) ----------
renderer.localClippingEnabled = true;
const waterClip = new THREE.Plane(new THREE.Vector3(0, -1, 0), -4.2);
const gwTex = canvasTex(256, 256, noisy("#3f7fd8", ["#2f66bd", "#5b98e8", "#8fbdf3"], 1400, 9), 16, 6);
const groundwater = new THREE.Mesh(
  new THREE.PlaneGeometry(48, 18),
  new THREE.MeshLambertMaterial({ map: gwTex, emissive: 0x0c2450, clippingPlanes: [waterClip] })
);
groundwater.position.set(0, GROUND_BOTTOM + 9, 0.02);
scene.add(groundwater);
function setWaterTable(top) { waterClip.constant = top; }

// ---------- pool rig: pivot so the shell can lift and tilt ----------
const PIVOT = new THREE.Vector3(0, -1.5, -3.2);
const poolRig = new THREE.Group();
poolRig.position.copy(PIVOT);
scene.remove(pool);
poolRig.add(pool);
pool.position.copy(PIVOT).negate();
scene.add(poolRig);

// ---------- force arrows ----------
const arrowMat = new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x888888 });
const downMat = new THREE.MeshLambertMaterial({ color: 0xffd400, emissive: 0x806a00, transparent: true });
function arrow(material) {
  const a = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.4), material);
  const head = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.6, 16), material);
  shaft.position.y = 0.7; head.position.y = 1.7;
  a.add(shaft, head);
  return a;
}
const upArrows = new THREE.Group();
scene.add(upArrows);
for (const x of [-3.2, -1.6, 1.2, 2.6, 3.9]) {
  const a = arrow(arrowMat);
  a.position.set(x, (x < 0 ? P.shallow : P.deep) - 2.6, 0.4);
  a.userData.baseY = a.position.y;
  upArrows.add(a);
}
const downArrows = new THREE.Group();
pool.add(downArrows);
for (const x of [-2.6, 0, 2.6]) {
  const a = arrow(downMat);
  a.rotation.z = Math.PI;
  a.position.set(x, 2.3, -1.2);
  downArrows.add(a);
}

// ---------- dirt burst ----------
const dirt = [];
const dirtMats = ["#6e4524", "#8a5a33", "#4f8f34"].map(c => new THREE.MeshLambertMaterial({ color: c }));
for (let i = 0; i < 70; i++) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), dirtMats[i % 3]);
  const side = i % 2 ? 1 : -1;
  m.userData = {
    o: new THREE.Vector3(side * (4.4 + Math.random() * 0.6), 0.1, -Math.random() * 6.4),
    v: new THREE.Vector3(side * (1 + Math.random() * 4), 5 + Math.random() * 7, 1 + Math.random() * 4),
    s: 0.15 + Math.random() * 0.35, spin: Math.random() * 10,
  };
  m.scale.setScalar(m.userData.s);
  m.castShadow = true;
  scene.add(m);
  dirt.push(m);
}
function setDirt(tau) {
  for (const m of dirt) {
    const { o, v, spin } = m.userData;
    m.visible = tau > 0 && tau < 3;
    if (!m.visible) continue;
    let y = o.y + v.y * tau - 9.8 * tau * tau;
    m.position.set(o.x + v.x * tau, Math.max(0.1, y), o.z + v.z * tau);
    m.rotation.set(spin * tau, spin * tau * 0.7, 0);
  }
}

// ---------- timeline ----------
const ease = x => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
const lerp = (a, b, k) => a + (b - a) * k;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const cams = {
  start:       { pos: V(0, 14, 44), look: V(0, 0, -12) },
  intro:       { pos: V(0, 6, 26),  look: V(0, -3.6, -8) },
  underground: { pos: V(0, -3, 24), look: V(0, -7, -4) },
  boat:        { pos: V(0, 4.5, 16), look: V(0, -2.4, -3) },
  balance:     { pos: V(0, 5, 17), look: V(0, -2, -3) },
  drain:       { pos: V(0, 5, 17), look: V(0, -2, -3) },
  push:        { pos: V(0, 2.5, 19), look: V(0, -3, -3) },
  pop:         { pos: V(0, 4, 26),  look: V(0, 0, -6) },
  outro:       { pos: V(0, 9, 36),  look: V(0, 0.5, -10) },
};

let TIMING;
const captionEl = document.getElementById("caption");

// group words into 1–2 word caption chunks
function chunks(words) {
  const out = [];
  for (let i = 0; i < words.length; i++) {
    const w = words[i], next = words[i + 1];
    const clean = s => s.word.replace(/\.\.\.$/, "");
    if (!w.hl && next && !next.hl && (clean(w) + clean(next)).length <= 9 && !/[.,]$/.test(w.word)) {
      out.push({ text: clean(w) + " " + clean(next), start: w.start, hl: false }); i++;
    } else out.push({ text: clean(w), start: w.start, hl: w.hl });
  }
  return out;
}

function setCaption(t) {
  const shot = TIMING.shots.find(s => t >= s.start && t < s.end) || TIMING.shots.at(-1);
  const cs = chunks(shot.words);
  let cur = null;
  for (const c of cs) if (t >= c.start) cur = c;
  if (!cur || t > shot.speechEnd + 0.25) { captionEl.textContent = ""; return; }
  captionEl.textContent = cur.text.replace(/[.,]$/, "");
  captionEl.style.color = cur.hl ? "#ffd400" : "#fff";
  const dt = t - cur.start;
  const sc = dt < 0.08 ? 0.7 + (dt / 0.08) * 0.42 : Math.max(1, 1.12 - (dt - 0.08) * 1.2);
  captionEl.style.transform = `scale(${sc})`;
}

window.renderAt = (t) => {
  const shots = TIMING.shots;
  const i = Math.max(0, shots.findIndex(s => t >= s.start && t < s.end));
  const idx = t >= TIMING.duration ? shots.length - 1 : i;
  const S = shots[idx], name = S.shot;
  const k = (t - S.start) / (S.end - S.start);
  const at = n => shots.find(s => s.shot === n);
  const prog = n => { const s = at(n); return (t - s.start) / (s.end - s.start); };

  // camera: ease from previous shot's framing into this one's
  const from = cams[idx ? shots[idx - 1].shot : "start"], to = cams[name];
  const ck = ease(Math.min(1, k / 0.7));
  camera.position.lerpVectors(from.pos, to.pos, ck);
  const look = from.look.clone().lerp(to.look, ck);

  // groundwater rises during "underground"
  setWaterTable(lerp(GROUND_BOTTOM, -4.2, ease(prog("underground") / 0.8)));
  gwTex.offset.set(t * 0.02, Math.sin(t * 1.3) * 0.01);

  // pool water drains during "drain"
  setPoolWater(1 - ease(prog("drain") / 0.85));

  // arrows
  const bal = prog("balance"), push = prog("push");
  const upAmt = bal < 0 ? 0 : push < 0 ? 0.55 * ease(bal / 0.3) : lerp(0.55, 1.25, ease(push / 0.5));
  upArrows.visible = upAmt > 0.01 && prog("outro") < 0;
  upArrows.children.forEach((a, j) => {
    const pulse = push > 0 ? 1 + 0.12 * Math.sin(t * 14 + j) : 1;
    a.scale.setScalar(Math.max(0.01, upAmt * pulse));
    a.position.y = a.userData.baseY + (push > 0 ? 0.3 * Math.sin(t * 7 + j) : 0);
  });
  const downAmt = bal < 0 ? 0 : ease(bal / 0.3) * (1 - ease(prog("drain") / 0.6));
  downArrows.visible = downAmt > 0.01;
  downArrows.children.forEach(a => a.scale.setScalar(Math.max(0.01, downAmt)));

  // the pool: trembles while being pushed, then pops out and tilts
  const pop = prog("pop");
  let lift = 0, tilt = 0, shake = 0;
  if (push > 0 && pop < 0) { lift = 0.25 * ease(push); shake = 0.05 + 0.1 * push; }
  if (pop >= 0) {
    const p = ease(Math.min(1, pop / 0.55));
    lift = lerp(0.25, 4.2, p) - 0.6 * ease((pop - 0.55) / 0.3);
    tilt = 0.16 * p;
    shake = 0.35 * (1 - Math.min(1, pop / 0.8));
  }
  const jitter = (a, f) => shake * a * Math.sin(t * f);
  poolRig.position.set(PIVOT.x + jitter(0.4, 41), PIVOT.y + lift + jitter(0.3, 53), PIVOT.z);
  poolRig.rotation.z = tilt + jitter(0.02, 37);
  setDirt(pop >= 0 ? (t - at("pop").start) * 1.1 : -1);

  // camera shake follows the pool
  camera.position.x += jitter(0.25, 47);
  camera.position.y += jitter(0.2, 59);
  camera.lookAt(look);

  setCaption(t);
  renderer.render(scene, camera);
};

const params = new URLSearchParams(location.search);
TIMING = await (await fetch(params.get("timing") || "/out/timing.json")).json();
window.duration = TIMING.duration;
window.renderAt(Number(params.get("t") || 0));
window.ready = true;
</script>
</body>
</html>
